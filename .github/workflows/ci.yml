name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - name: JS 语法校验（排除第三方压缩库）
        run: |
          for f in js/*.js; do
            case "$f" in *xlsx*) continue;; esac
            node --check "$f"
          done
      - name: 版本号一致性
        run: node -e "
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('package.json')).version;
          const mf=fs.readFileSync('android/app/AndroidManifest.xml','utf8');
          if(!mf.includes('versionName=\"'+v+'\"')) process.exit(1);
          console.log('version', v, 'OK');
        "
